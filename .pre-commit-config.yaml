default_language_version:
  python: python3.12

repos:
  # Basic repository hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Ruff linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Mypy static type checking (settings are in pyproject.toml)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^(nexgenpy|tests)/
        # The hook runs in an isolated venv, so it needs the imported packages
        additional_dependencies:
          - pydantic>=2.13.5
          - pytest>=9.1.1
          - types-requests

  # Gitleaks secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans only the staged changes, so --all-files does not widen it
      - id: gitleaks
      # Scans the full git history (CI runs this hook)
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  # Semgrep static analysis (CI runs this hook too)
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.182.1
    hooks:
      - id: semgrep
        # Files passed on the command line bypass .semgrepignore
        exclude: ^(dist|\.claude/skills)/
        args:
          - scan
          - --config=p/python
          - --config=p/security-audit
          - --config=p/secrets
          - --config=p/github-actions
          - --error
          - --metrics=off
          # Parallel jobs can fail with "io_uring_queue_init: Cannot allocate
          # memory" under the default 8 MB memlock limit
          - --jobs=1
          - --disable-version-check
          - --quiet
          - --skip-unknown-extensions