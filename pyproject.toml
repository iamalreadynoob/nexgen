[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name="nexgenpy"
version="1.0.0"
description="Post Shannon Communication for every day systems"
readme="README.md"
requires-python=">= 3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["semantic communication", "semcom", "6g", "actuator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
]
authors=[
    {name="iamalreadynoob", email="sadikefe69@gmail.com"}
]
dependencies = [
    "pydantic>=2.13.5",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/iamalreadynoob/nexgen"
Documentation = "https://github.com/iamalreadynoob/nexgen/tree/main/docs"
Issues = "https://github.com/iamalreadynoob/nexgen/issues"
Changelog = "https://github.com/iamalreadynoob/nexgen/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    "__init__.py",
    ".env",
    ".gitignore",
    "requirements.txt",
    "uv.lock",
    ".claude/skills",
    "docs"
]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "W",   # whitespace and newlines
    "I",   # isort
    "UP",  # modernize
    "ANN", # flake8 type annotations
    "S",   # flake8 bandit
    "B",   # flake8 bugbear
    "C4",  # flake8 comprehensions
    "COM", # flake8 commas
    "T20", # flake8 print
    "SIM", # flake8 simplify
    "ARG", # flake8 unused arguments
    "DTZ", # flake8 datetimes
    "Q",   # flake8 quotes
    "TCH", # flake8 typecheck
    "D",   # pydocstyle
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]
ignore = [
    "D203", "D213", "D215", "D400", "D401", "D404", "D406",
    "D407", "D408", "D409", "D413", "UP035", "UP006", "D107",
    "LOG015", "UP015"
]
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
"test*" = ["D", "ANN"]
"tests/**" = ["D", "ANN", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: creates real venvs and runs pip (slow)",
]
